name: Hello World

on: 
  workflow_dispatch:

jobs:
  say-hello-1:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello, World!"
  say-hello-2:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello using python
        run: print("Hello, World!")
        shell: python
  say-hello-3:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello using node
        run: console.log("Hello, World!")
        shell: node