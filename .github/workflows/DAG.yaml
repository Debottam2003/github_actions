name: DAG Actions

on:
  workflow_dispatch:

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1
        run: echo "This is Job 1"
  job2:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1
        run: echo "This is Job 2"
  job3:
    runs-on: ubuntu-latest
    needs: 
      - job1
      - job2
    steps:
      - name: Step 1
        run: echo "This is Job 3 done after Job 1 and Job 2"